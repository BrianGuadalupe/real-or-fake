name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      folder_url:
        description: Public Google Drive folder URL (optional override)
        required: false
        type: string
      folder_mode:
        description: How videos in the folder are classified
        required: true
        default: configured
        type: choice
        options:
          - configured
          - fake
          - real
          - subfolders

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DRIVE_FOLDER_URL: ${{ inputs.folder_url || vars.DRIVE_FOLDER_URL }}
      DRIVE_FOLDER_MODE: ${{ (inputs.folder_mode != 'configured' && inputs.folder_mode) || vars.DRIVE_FOLDER_MODE || 'fake' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        if: env.DRIVE_FOLDER_URL != ''
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Install Drive media tools
        if: env.DRIVE_FOLDER_URL != ''
        run: |
          python -m pip install gdown==6.2.0
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes ffmpeg
          fi

      - name: Import Google Drive folder
        if: env.DRIVE_FOLDER_URL != ''
        run: npm run sync:drive

      - name: Build static site
        run: npm run build:pages

      - name: Verify static export
        run: |
          test -f dist/pages/index.html
          npm run validate:pages

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
